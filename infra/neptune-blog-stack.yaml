AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Test infrastructure for the Neptune online index rebuild blog run.
  Neptune 1.5.x cluster (private subnets, IAM auth, encrypted) + an SSM-managed
  EC2 runner in the same VPC + S3 bucket for bulk-load data. NOT for production.
  Deploy it once per cluster (for example a main cluster and a streams cluster) with
  different parameters; names default from the stack name so stacks do not collide.
  The neptune_lab_mode and neptune_streams* settings are static cluster parameters:
  after changing them, reboot the writer for them to take effect.
  Delete the stack when finished to stop all charges (python scripts/teardown.py).

Parameters:
  EngineVersion:
    Type: String
    Default: "1.5.0.1"
    Description: 1.5.0.0 or later; 1.5.0.1 recommended.
  NeptuneInstanceClass:
    Type: String
    Default: db.r6g.large
    Description: >
      Use db.r6g.2xlarge or larger to exercise dictionary garbage collection,
      which pauses when freeable memory is below 15 GB.
  ClusterIdentifier:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{0,39}$"
    Description: >
      DB cluster identifier. Empty = use the stack name, so the stack name must then be
      lowercase letters, digits and hyphens, start with a letter, and be at most 40
      characters.
  WriterInstanceIdentifier:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{0,49}$"
    Description: Writer instance identifier. Empty = "<stack name>-writer".
  ParameterGroupFamily:
    Type: String
    AllowedPattern: "^neptune[0-9.]*$"
    Description: >
      DB cluster parameter group family for EngineVersion, for example neptune1.4. No
      default on purpose: look it up with
      aws neptune describe-db-engine-versions --engine neptune --engine-version <EngineVersion>
      --query "DBEngineVersions[].DBParameterGroupFamily".
  LabMode:
    Type: String
    Default: ""
    Description: >
      Value for neptune_lab_mode, for example DictionaryGCMode=soft_delete. Empty = not
      set. Static: reboot the writer after changing it.
  StreamsEnabled:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: "Value for neptune_streams. Static parameter: reboot the writer after changing it."
  StreamsExpiryDays:
    Type: String
    Default: "7"
    AllowedPattern: "^[0-9]{1,2}$"
    Description: Value for neptune_streams_expiry_days (only matters when streams are on).
  RunnerInstanceType:
    Type: String
    Default: t3.micro
  RunnerAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  ClusterNameFromStack: !Equals [!Ref ClusterIdentifier, ""]
  WriterNameFromStack: !Equals [!Ref WriterInstanceIdentifier, ""]
  HasLabMode: !Not [!Equals [!Ref LabMode, ""]]

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: neptune-blog-vpc }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: neptune-blog-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: neptune-blog-private-b }]

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: neptune-blog-public }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Free gateway endpoint so the Neptune bulk loader can read from S3.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable, !Ref PublicRouteTable]

  # ---------------------------------------------------------------- Security groups
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neptune blog runner - no inbound; access via SSM only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  NeptuneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neptune blog cluster - 8182 from runner only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8182
          ToPort: 8182
          SourceSecurityGroupId: !Ref RunnerSecurityGroup

  # ---------------------------------------------------------------- S3 + loader role
  # Destination for S3 server access logs of DataBucket.
  # It also logs its own access to itself (no DestinationBucketName = same bucket).
  # Log delivery to a bucket that itself has logging enabled produces logs about
  # log writes, so the lifecycle rule below expires log objects to bound growth.
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      LoggingConfiguration:
        LogFilePrefix: self-access-logs/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration:
        Status: Enabled

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt AccessLogsBucket.Arn, !Sub "${AccessLogsBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: false } }
          # ACLs are disabled (BucketOwnerEnforced), so S3 log delivery is granted
          # through the bucket policy, scoped to this account's buckets.
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: s3:PutObject
            Resource:
              - !Sub "${AccessLogsBucket.Arn}/access-logs/*"
              - !Sub "${AccessLogsBucket.Arn}/self-access-logs/*"
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogsBucketPolicy
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: access-logs/

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: false } }

  NeptuneLoaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: rds.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-load-bucket
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]

  # ---------------------------------------------------------------- Neptune
  NeptuneSubnetGroup:
    Type: AWS::Neptune::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Neptune blog private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # Static cluster parameters: after changing them on a running cluster, reboot the writer.
  NeptuneClusterParameterGroup:
    Type: AWS::Neptune::DBClusterParameterGroup
    Properties:
      Description: !Sub "${AWS::StackName} cluster parameters (lab mode, streams)"
      Family: !Ref ParameterGroupFamily
      Parameters:
        neptune_streams: !Ref StreamsEnabled
        neptune_streams_expiry_days: !Ref StreamsExpiryDays
        neptune_lab_mode: !If [HasLabMode, !Ref LabMode, !Ref "AWS::NoValue"]

  NeptuneCluster:
    Type: AWS::Neptune::DBCluster
    Properties:
      DBClusterIdentifier: !If [ClusterNameFromStack, !Ref "AWS::StackName", !Ref ClusterIdentifier]
      DBClusterParameterGroupName: !Ref NeptuneClusterParameterGroup
      EngineVersion: !Ref EngineVersion
      DBSubnetGroupName: !Ref NeptuneSubnetGroup
      VpcSecurityGroupIds: [!Ref NeptuneSecurityGroup]
      IamAuthEnabled: true
      StorageEncrypted: true
      DeletionProtection: false
      BackupRetentionPeriod: 1
      AssociatedRoles:
        - RoleArn: !GetAtt NeptuneLoaderRole.Arn

  NeptuneWriter:
    Type: AWS::Neptune::DBInstance
    Properties:
      DBClusterIdentifier: !Ref NeptuneCluster
      DBInstanceClass: !Ref NeptuneInstanceClass
      DBInstanceIdentifier: !If [WriterNameFromStack, !Sub "${AWS::StackName}-writer", !Ref WriterInstanceIdentifier]

  # ---------------------------------------------------------------- Runner EC2
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: neptune-blog-runner
          PolicyDocument:
            Statement:
              # Only the Neptune data-plane actions the scripts call, on this cluster only.
              - Sid: NeptuneStorageAndIndexRebuild
                Effect: Allow
                Action:
                  - neptune-db:GetStorageInfo
                  - neptune-db:StartIndexRebuild
                  - neptune-db:GetIndexRebuildStatus
                  - neptune-db:ListIndexRebuilds
                  - neptune-db:CancelIndexRebuild
                  - neptune-db:GetGraphSummary
                  - neptune-db:GetEngineStatus
                Resource: !Sub "arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*"
              - Sid: NeptuneBulkLoad
                Effect: Allow
                Action:
                  - neptune-db:StartLoaderJob
                  - neptune-db:GetLoaderJobStatus
                  - neptune-db:ListLoaderJobs
                Resource: !Sub "arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*"
              # openCypher MATCH/RETURN (read), SET (write), DETACH DELETE (delete).
              - Sid: NeptuneQueries
                Effect: Allow
                Action:
                  - neptune-db:ReadDataViaQuery
                  - neptune-db:WriteDataViaQuery
                  - neptune-db:DeleteDataViaQuery
                Resource: !Sub "arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*"
              # TEST STACK ONLY: lets storage_info.py --refresh-stats refresh statistics
              # so the graph-summary live counts are fresh. Not needed for the rebuild.
              - Sid: NeptuneStatisticsRefreshTestOnly
                Effect: Allow
                Action:
                  - neptune-db:ManageStatistics
                  - neptune-db:GetStatisticsStatus
                Resource: !Sub "arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*"
              - Sid: LoadBucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
              # CloudWatch metric reads do not support resource-level permissions.
              - Sid: CloudWatchRead
                Effect: Allow
                Action: [cloudwatch:GetMetricStatistics, cloudwatch:GetMetricData]
                Resource: "*"
              - Sid: DescribeThisCluster
                Effect: Allow
                Action: [rds:DescribeDBClusters]
                Resource: !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${NeptuneCluster}"
              - Sid: DescribeForPreflight
                Effect: Allow
                Action: [rds:DescribeDBInstances, rds:DescribeDBClusterParameters]
                Resource:
                  - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*"
                  - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-pg:*"

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RunnerRole]

  RunnerInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: !Ref RunnerAmi
      InstanceType: !Ref RunnerInstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref RunnerSecurityGroup]
      IamInstanceProfile: !Ref RunnerInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y python3.12 python3.12-pip git
          python3.12 -m pip install "boto3>=1.43.124"
      Tags: [{ Key: Name, Value: neptune-blog-runner }]

Outputs:
  ClusterIdentifier:
    Value: !Ref NeptuneCluster
  WriterInstanceIdentifier:
    Value: !Ref NeptuneWriter
  ClusterParameterGroupName:
    Value: !Ref NeptuneClusterParameterGroup
  ParameterChangeNote:
    Value: >
      neptune_lab_mode and neptune_streams* are static: after changing them in this
      parameter group, reboot the writer (aws neptune reboot-db-instance) to apply them.
  ClusterEndpoint:
    Value: !GetAtt NeptuneCluster.Endpoint
  ClusterResourceId:
    Value: !GetAtt NeptuneCluster.ClusterResourceId
  LoaderRoleArn:
    Value: !GetAtt NeptuneLoaderRole.Arn
  DataBucketName:
    Value: !Ref DataBucket
  RunnerInstanceId:
    Value: !Ref RunnerInstance
